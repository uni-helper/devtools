name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Setup corepack
        run: npm install -f -g npm@latest corepack@latest && corepack enable

      - name: GitHub Release
        run: pnpx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # dist 不入库，必须现场构建；面板会在这一步拷进 core
      - name: Build
        run: pnpm build

      - name: Check packages
        run: node scripts/check-publish.mjs

      # 根包是 private，必须 -r 才会发布 packages/*；预发布版本（tag 含 -）走 beta，
      # 不占 latest
      - name: Publish to NPM
        run: pnpm -r publish --access public --no-git-checks --tag ${{ contains(github.ref_name, '-') && 'beta' || 'latest' }}
